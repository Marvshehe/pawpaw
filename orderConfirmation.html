<!DOCTYPE html>
<html lang="en">
<head>
          <title>Order Confirmation - Marv's Burgers</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
  <style>
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }
    .confirmation-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .confirmation-box {
      max-width: 480px;
      width: 100%;
      background: #2a2a2a;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,0.5);
    }
    .confirmation-box h2 {
      color: #c49b63;
      font-size: 28px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 25px;
    }
    .order-ref {
      background: #c49b63;
      color: #1a1a1a;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 17px;
      letter-spacing: 1px;
      display: inline-block;
      margin-bottom: 25px;
    }
    .qr-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
    .qr-container img {
      width: 260px;
      height: 260px;
      display: block;
    }
    .scan-text {
      font-size: 15px;
      color: #ccc;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .order-details {
      text-align: left;
      background: #222;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      font-size: 15px;
    }
    .order-details p {
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .order-details .total {
      color: #c49b63;
      font-size: 20px;
      font-weight: 600;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #444;
    }
    #payment-status {
      margin: 20px 0;
      font-size: 15px;
      min-height: 48px;
      line-height: 1.5;
    }
    .pending {
      color: #f0ad4e;
    }
    .success {
      color: #51cf66;
      font-weight: 600;
    }
    .expired {
      color: #ff6b6b;
    }
    .back-link {
      display: inline-block;
      margin-top: 15px;
      color: #c49b63;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(240,173,78,0.3);
      border-top-color: #f0ad4e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    :root {
      --burger-orange: #f15a24;
      --burger-red: #b9361d;
      --bun: #f4b35f;
      --charcoal: #171313;
      --grill: #241b18;
    }
    body {
      background: radial-gradient(circle at top, #3a2117 0, var(--charcoal) 44%, #0f0d0d 100%);
      color: #fff;
    }
    .confirmation-wrapper { position: relative; overflow: hidden; }
    .confirmation-wrapper::before,
    .confirmation-wrapper::after {
      content: '';
      position: absolute;
      width: 260px;
      height: 260px;
      border: 1px solid rgba(244,179,95,.13);
      border-radius: 50%;
      pointer-events: none;
    }
    .confirmation-wrapper::before { top: -120px; left: -100px; box-shadow: 0 0 0 24px rgba(244,179,95,.035), 0 0 0 48px rgba(244,179,95,.025); }
    .confirmation-wrapper::after { right: -130px; bottom: -130px; box-shadow: 0 0 0 24px rgba(241,90,36,.04), 0 0 0 48px rgba(241,90,36,.025); }
    .confirmation-box {
      position: relative;
      z-index: 1;
      max-width: 540px;
      background: rgba(36, 27, 24, .96);
      border: 1px solid rgba(244,179,95,.25);
      border-radius: 14px;
      padding: 42px 34px;
      box-shadow: 0 25px 70px rgba(0,0,0,.45);
    }
    .confirmation-box::before {
      content: 'MARV\0027S BURGERS';
      display: block;
      color: var(--burger-orange);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .2em;
      margin-bottom: 14px;
    }
    .confirmation-box h2 { color: #fff; font-family: 'Josefin Sans', sans-serif; font-size: 34px; letter-spacing: .02em; }
    .subtitle { color: #d8c9c0; }
    .order-ref { background: var(--burger-orange); color: #fff; border-radius: 7px; letter-spacing: .12em; }
    .qr-container { padding: 16px; border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.3); }
    .scan-text { color: #d8c9c0; }
    .order-details { background: #171313; border: 1px solid rgba(244,179,95,.12); border-radius: 10px; }
    .order-details p { color: #d8c9c0; }
    .order-details .total { color: var(--bun); border-top-color: rgba(244,179,95,.18); }
    .pending { color: var(--bun); }
    .success { color: #72d18b; }
    .expired { color: #ff806b; }
    .back-link { color: var(--bun); }
    .back-link:hover { color: var(--burger-orange); }
    .spinner { border-color: rgba(244,179,95,.25); border-top-color: var(--burger-orange); }
    @media (max-width: 560px) {
      .confirmation-wrapper { padding: 22px 14px; }
      .confirmation-box { padding: 32px 20px; }
      .qr-container img { width: min(260px, 70vw); height: min(260px, 70vw); }
    }
  </style>
</head>
<body>
  <div class="confirmation-wrapper">
    <div class="confirmation-box">
      <h2>Scan to Pay</h2>
      <p class="subtitle">Unique QR Code generated for your order</p>

      <div class="order-ref" id="order-ref">ORDER-XXXXXX</div>

      <div class="qr-container">
        <img id="qr-image" src="" alt="PayMongo QR Ph">
      </div>

      <p class="scan-text">
        Scan using <strong>GCash, Maya, or any bank app</strong><br>
        that supports <strong>QR Ph</strong><br>
        <small>(QR expires in 30 minutes)</small>
      </p>

      <div class="order-details" id="order-details">
        <!-- filled by JS -->
      </div>

      <!-- Status message (no button) -->
      <div id="payment-status" class="pending">
        <span class="spinner"></span> Waiting for payment...
      </div>

      <a href="checkout.html" class="back-link">← Back to Checkout</a>
    </div>
  </div>

<script>
  // ========== LOAD ORDER DATA ==========
  const orderData = JSON.parse(sessionStorage.getItem('paymongoOrder') || '{}');

  if (!orderData.qr_image_url || !orderData.payment_intent_id) {
    document.body.innerHTML = `
      <div style="color:white;text-align:center;padding:100px 20px;font-family:Poppins,sans-serif;">
        <h2 style="color:#c49b63;margin-bottom:16px;">No order found</h2>
        <p style="color:#aaa;margin-bottom:30px;">Please go back and place your order again.</p>
        <a href="checkout.html" style="color:#c49b63;text-decoration:none;font-weight:600;">
          ← Go back to checkout
        </a>
      </div>`;
  } else {
    // Fill QR + order reference
    document.getElementById('qr-image').src = orderData.qr_image_url;
    document.getElementById('order-ref').textContent =
      orderData.order_ref || 'ORDER-' + Date.now();

    // Build order details
    let itemsHtml = '';
    if (orderData.items && Array.isArray(orderData.items) && orderData.items.length) {
      orderData.items.forEach(item => {
        const lineTotal = (Number(item.price) * Number(item.quantity)).toFixed(2);
        itemsHtml += `
          <p>
            <span>${item.name} × ${item.quantity}</span>
            <span>₱${lineTotal}</span>
          </p>`;
      });
    }

    document.getElementById('order-details').innerHTML = `
      <p><span>Customer</span><span>${orderData.name || '-'}</span></p>
      <p><span>Email</span><span>${orderData.email || '-'}</span></p>
      <p><span>Phone</span><span>${orderData.phone || '-'}</span></p>
      ${itemsHtml}
      <p class="total">
        <span>Total Amount</span>
        <span>₱${Number(orderData.amount || 0).toFixed(2)}</span>
      </p>
    `;

    // ========== AUTO CHECK PAYMENT ==========
    const statusEl = document.getElementById('payment-status');
    let pollCount = 0;
    const maxPolls = 72;          // 72 × 5s = 6 minutes
    let pollingStopped = false;

    async function checkPaymentStatus() {
      if (pollingStopped) return true;

      try {
        const res = await fetch(
          'https://intern7zsa-github-com.vercel.app/api/check-payment?id=' +
          encodeURIComponent(orderData.payment_intent_id)
        );

        if (!res.ok) throw new Error('Network response was not ok');

        const data = await res.json();

        // Payment succeeded
        if (data.paid === true || data.status === 'succeeded') {
          pollingStopped = true;
          statusEl.className = 'success';
          statusEl.innerHTML = '✅ Payment received! Redirecting...';

          // Clear cart + order data
          localStorage.removeItem('coffeeBlendCart');
          sessionStorage.removeItem('paymongoOrder');

          // Redirect to success page
          setTimeout(() => {
            window.location.href = 'success.html';
          }, 1200);

          return true;
        }

        // Still waiting
        statusEl.className = 'pending';
        statusEl.innerHTML = `
          <span class="spinner"></span>
          Waiting for payment...<br>
          <small>Scan the QR with GCash / Maya</small>
        `;
        return false;

      } catch (err) {
        console.error('Payment check error:', err);
        statusEl.className = 'pending';
        statusEl.innerHTML = `
          <span class="spinner"></span>
          Checking payment status...
        `;
        return false;
      }
    }

    // Start checking after 2 seconds, then every 5 seconds
    setTimeout(async () => {
      const paid = await checkPaymentStatus();
      if (paid) return;

      const interval = setInterval(async () => {
        pollCount++;
        const paid = await checkPaymentStatus();

        if (paid || pollCount >= maxPolls) {
          clearInterval(interval);
          pollingStopped = true;

          if (!paid) {
            statusEl.className = 'expired';
            statusEl.innerHTML = `
              QR expired or payment not received.<br>
              <a href="checkout.html" style="color:#c49b63;">Try again</a>
            `;
          }
        }
      }, 5000);
    }, 2000);
  }
</script>
</body>
</html>
